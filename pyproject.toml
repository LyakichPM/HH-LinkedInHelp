[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hh-agent"
version = "0.1.0"
description = "CLI tools for hh.ru job search automation + Telegram bridge"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ilia Kovalev"},
]
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "click>=8.0",
    "requests>=2.28",
]

[project.scripts]
hh = "hh.cli:cli"

[tool.setuptools.packages.find]
include = ["hh*"]
